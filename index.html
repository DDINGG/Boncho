<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>본초 노트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&family=Nanum+Myeongjo&family=Nanum+Gothic&family=Gowun+Batang&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sh:120px;
  --bg:#edf0ec; --surface:#f9fbf8; --sunk:#e1e8e2; --ink:#1b2928; --ink2:#465957; --mute:#788886;
  --line:#ccd6d0; --accent:#2d6b62; --accent-soft:#d6e8e3; --onaccent:#ffffff; --hanja:#243f66; --seal:#b0382b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#172120; --sunk:#1d2927; --ink:#e3ebe8; --ink2:#aebdb9; --mute:#80918d;
    --line:#2c3b38; --accent:#6fb8aa; --accent-soft:#1f3733; --onaccent:#0b1715; --hanja:#a5bde0; --seal:#e5695a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --sunk:#1d2927; --ink:#e3ebe8; --ink2:#aebdb9; --mute:#80918d;
  --line:#2c3b38; --accent:#6fb8aa; --accent-soft:#1f3733; --onaccent:#0b1715; --hanja:#a5bde0; --seal:#e5695a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand-hj{font:700 24px 'Noto Serif KR',serif;color:var(--hanja);letter-spacing:.04em}
.brand-ko{font-weight:700;font-size:15px}
.searchbox{flex:1 1 260px;min-width:0;order:2}
#q{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;border-radius:3px;font:inherit}
#q::placeholder{color:var(--mute)}
.top-actions{display:flex;gap:6px;align-items:center;margin-left:auto;order:1}
#stat{font-size:12px;color:var(--mute);min-width:0}
#listbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 14px 8px;max-width:1280px;margin:0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-size:13px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#count{margin-left:auto;font-size:12.5px;color:var(--mute)}
#btnCats{display:none}
#jump{display:flex;gap:4px;overflow-x:auto;padding:0 14px 8px;max-width:1280px;margin:0 auto;scrollbar-width:thin}
#jump button{flex:0 0 auto;min-width:30px;height:28px;padding:0 8px;border:1px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer;font-size:13px;color:var(--ink2)}
#jump:empty{display:none}

#banner{max-width:1280px;margin:10px auto 0;padding:0 14px}
#banner .bn{padding:10px 12px;border:1px solid var(--seal);color:var(--seal);border-radius:3px;font-size:13.5px;background:var(--surface)}
#shell{display:flex;gap:18px;max-width:1280px;margin:0 auto;padding:14px}
#side{flex:0 0 218px;position:sticky;top:calc(var(--sh) + env(safe-area-inset-top,0px) + 12px);align-self:flex-start;max-height:calc(100vh - var(--sh) - 40px);overflow:auto;padding-right:4px}
#main{flex:1;min-width:0}
.side-h{font:700 13px 'Noto Sans KR',sans-serif;color:var(--mute);margin:0 0 6px}
.sd{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:3px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.sd em{font-style:normal;font-size:11.5px;color:var(--mute)}
.sd[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sd.ch{font-weight:600;color:var(--ink)}
.sd-kids{margin:0 0 4px 10px;border-left:1px solid var(--line);padding-left: 4px}
@media (hover:hover){.sd:hover{background:var(--sunk)}}
#sideClose{display:none}

.grp{scroll-margin-top:calc(var(--sh) + 8px)}
.gh{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);font:700 20px 'Noto Serif KR',serif}
.gh:first-child{margin-top:4px}
.gh small{font:400 12.5px 'Noto Sans KR',sans-serif;color:var(--mute)}
.gh .ghj{color:var(--hanja)}
.gh2{display:flex;align-items:baseline;gap:8px;margin:16px 0 8px;font:600 15px 'Noto Sans KR',sans-serif;color:var(--ink2)}
.gh2 small{font-size:12px;color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:106px;padding:16px 6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:3px;color:var(--ink);text-decoration:none;text-align:center;overflow:hidden}
.card::before{content:"";position:absolute;top:6px;left:50%;width:22px;height:4px;margin-left:-11px;border-radius:2px;background:var(--line)}
.card .hj{font:600 27px/1.15 'Noto Serif KR',serif;color:var(--hanja);word-break:keep-all}
.card .hj.m{font-size:21px}
.card .hj.l{font-size:16px}
.card .hj.k{font:600 18px/1.25 'Noto Sans KR',sans-serif;color:var(--ink)}
.card .kr{font-size:14px;font-weight:500}
.card .ct{font-size:10.5px;color:var(--mute);line-height:1.3}
.card .sn{font-size:10.5px;color:var(--ink2);line-height:1.3;max-height:2.6em;overflow:hidden}
.mk{position:absolute;top:5px;right:6px;display:flex;gap:3px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.seal{color:var(--seal);font-size:12px;line-height:1}
@media (hover:hover){.card:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.row:hover{background:var(--sunk)}}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:3px}
.row{display:grid;grid-template-columns:120px 120px 1fr auto;align-items:center;gap:6px 10px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.row:last-child{border-bottom:0}
.r-hj{font:600 18px 'Noto Serif KR',serif;color:var(--hanja)}
.r-kr{font-weight:500}
.r-ct{font-size:12.5px;color:var(--mute)}
.r-mk{display:flex;gap:6px;align-items:center;min-width:28px;justify-content:flex-end}
.r-sn{grid-column:1/-1;font-size:12.5px;color:var(--ink2)}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.empty .btn{margin-top:10px}

.btn{font-size:13.5px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.sm{height:30px;padding:0 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
@media (hover:hover){.btn:hover:not(:disabled){border-color:var(--accent)}}

.d-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.d-bar .sp{flex:1}
.d-head{display:flex;flex-direction:column;gap:2px;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.d-hj{font:700 clamp(34px,9vw,60px)/1.1 'Noto Serif KR',serif;color:var(--hanja);word-break:keep-all}
.d-head h1{margin:0;font-size:22px;font-weight:700}
.d-cat{font-size:13px;color:var(--mute)}
.d-alias{font-size:13px;color:var(--ink2)}
.basic{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0 4px;padding:12px;background:var(--sunk);border-radius:3px}
.basic label,.info label{display:block;font-size:12px;color:var(--mute)}
.basic input,.basic select,.info input,.info textarea{display:block;width:100%;margin-top:3px;font:inherit;font-size:14.5px;color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:6px 8px;border-radius:3px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:14px 0}
.info .w{grid-column:1/-1}
.f dt{font-size:12px;color:var(--mute);margin-bottom:1px}
.f dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.f dd.nil{color:var(--mute)}
.info textarea{resize:vertical;min-height:38px;overflow:hidden}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-top:8px}
.tab{flex:0 0 auto;padding:9px 16px;border:0;background:transparent;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-size:14.5px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tabtools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.edtb{position:sticky;top:calc(var(--sh) + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;margin-top:10px;background:var(--sunk);border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0}
.edtb button,.edtb select,.edtb label.cb{height:32px;min-width:32px;padding:0 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.edtb select{padding:0 4px;max-width:118px}
.edtb .tl{font-size:11px;color:var(--mute);padding:0 2px}
.edtb button.sw{min-width:30px;width:30px;height:30px;padding:0;font-weight:700;font-size:15px;border-radius:50%}
.edtb button.sw.sb{border-color:var(--line)}
.edtb input.szn{width:62px;height:32px;padding:0 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;font-size:13px}
.cm-row input.fi{flex:1;min-width:0;font:inherit;font-size:14.5px;color:var(--ink);border:1px solid var(--line);background:var(--bg);padding:5px 8px;border-radius:3px}
.pal-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.pal-row input[type=color]{width:46px;height:34px;padding:2px;border:1px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer}
.pal-hex{flex:1;font-size:13px;color:var(--mute)}
.edtb .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.edtb label.cb{position:relative;gap:4px}
.edtb label.cb input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.edtb label.cb i{display:block;width:14px;height:4px;border-radius:1px;background:currentColor}
@media (max-width:800px){.edtb{flex-wrap:nowrap;overflow-x:auto}.edtb>*{flex:0 0 auto}}
.editor{min-height:260px;padding:16px 18px;border:1px solid var(--line);background:var(--surface);border-radius:3px;line-height:1.8;font-size:16px;outline:none;overflow-wrap:anywhere;overflow-x:auto}
.edtb+.editor{border-radius:0 0 3px 3px}
.editor:empty::before{content:attr(data-ph);color:var(--mute);pointer-events:none}
.editor[contenteditable="true"]:focus{border-color:var(--accent)}
.editor h1{font:700 1.6em/1.3 'Noto Serif KR',serif;margin:1em 0 .4em}
.editor h2{font:700 1.3em/1.35 'Noto Serif KR',serif;margin:1em 0 .4em}
.editor h3{font:700 1.12em/1.4 'Noto Sans KR',sans-serif;margin:1em 0 .3em}
.editor p{margin:.4em 0}
.editor blockquote{margin:.8em 0;padding:.2em 1em;border-left:3px solid var(--accent);color:var(--ink2);background:var(--sunk)}
.editor table{border-collapse:collapse;margin:.8em 0;max-width:100%}
.editor td,.editor th{border:1px solid var(--line);padding:6px 10px;min-width:60px;vertical-align:top}
.editor th{background:var(--sunk);text-align:left}
.editor img{max-width:100%;height:auto;border-radius:2px}
.editor[contenteditable="false"] img{cursor:zoom-in}
.editor img.sel{outline:2px solid var(--accent)}
.editor a{color:var(--accent);text-decoration:underline}
.editor hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.editor ul,.editor ol{padding-left:1.5em;margin:.4em 0}
.editor [style*="background-color"]:not([style*="transparent"]){color:#1b1b1b}
.d-foot{display:flex;justify-content:space-between;margin-top:18px;gap:8px;flex-wrap:wrap}

.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(10,18,17,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 14px 20px;overflow:auto}
.modal{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px}
.modal.wide{max-width:640px}
.modal h3{margin:0 0 10px;font:700 18px 'Noto Serif KR',serif}
.modal p{margin:0 0 10px;color:var(--ink2);font-size:14px;white-space:pre-wrap}
.modal .fld{display:block;margin:0 0 10px;font-size:12.5px;color:var(--mute)}
.modal .fld input,.modal .fld select,.modal .fld textarea{display:block;width:100%;margin-top:3px;font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);background:var(--bg);padding:8px 10px;border-radius:3px}
.modal .fld textarea{min-height:90px;resize:vertical}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.msec{padding:12px 0;border-top:1px solid var(--line)}
.msec:first-of-type{border-top:0}
.msec h4{margin:0 0 6px;font-size:14px}
.msec .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cm-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line)}
.cm-row .nm{flex:1;min-width:0;font-size:14px}
.cm-row .nm small{color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:3px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:80;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}

body[data-route="detail"] #listbar,body[data-route="detail"] #jump,body[data-route="detail"] #side{display:none !important}
@media (max-width:900px){
  #side{display:none}
  #side.open{display:block;position:fixed;inset:0;z-index:50;max-height:none;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 20px}
  #sideClose{display:inline-block;margin-bottom:10px}
  #btnCats{display:inline-block}
  #shell{padding:10px}
}
@media (max-width:560px){
  .row{grid-template-columns:86px 1fr auto}
  .r-ct{grid-column:2/4;order:5;font-size:12px}
  .info{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
  .brand-ko{display:none}
}
@media print{
  #stick,#side,.d-bar,.edtb,.tabtools,.basic,.d-foot,#toast,#banner{display:none !important}
  body{background:#fff;color:#000}
  #shell{display:block;padding:0}
  .editor,.tabs{border-color:#999}
  .d-hj{color:#000}
}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body data-route="list">
<div id="stick">
  <header id="top">
    <button class="brand" id="brand" type="button" aria-label="처음으로"><span class="brand-hj">本草</span><span class="brand-ko">본초 노트</span></button>
    <div class="searchbox"><input id="q" type="search" placeholder="이름 · 한자 · 초성(ㅇㅅ) · 본문 검색" autocomplete="off" enterkeyhint="search" aria-label="검색"></div>
    <div class="top-actions">
      <span id="stat"></span>
      <button class="btn sm" id="btnAdd" type="button">＋ 본초</button>
      <button class="btn sm" id="btnTheme" type="button" aria-label="테마 전환">테마</button>
      <button class="btn sm" id="btnMenu" type="button">설정</button>
    </div>
  </header>
  <div id="listbar">
    <button class="btn sm" id="btnCats" type="button">분류</button>
    <div class="seg" role="group" aria-label="보기 방식"><button type="button" data-view="grid">그리드</button><button type="button" data-view="list">목록</button></div>
    <div class="seg" role="group" aria-label="정렬 기준"><button type="button" data-sort="ko">가나다순</button><button type="button" data-sort="cat">분류별</button></div>
    <button class="chip" id="chipFav" type="button" aria-pressed="false">★ 즐겨찾기</button>
    <button class="chip" id="chipContent" type="button" aria-pressed="true">본문까지 검색</button>
    <span id="count"></span>
  </div>
  <div id="jump"></div>
</div>
<div id="banner"></div>
<div id="shell">
  <aside id="side" aria-label="분류"></aside>
  <main id="main">
    <div id="list"></div>
    <div id="detail" hidden></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const DATA = `
@해표약|解表藥
#발산풍한약|發散風寒藥|辛溫解表藥
마황/麻黃;계지/桂枝;자소엽/紫蘇葉;형개/荊芥;강활/羌活;백지/白芷;방풍/防風;고본/藁本;신이/辛夷;세신/細辛;생강/生薑;향유/香薷;총백/葱白;정류/檉柳;창이자/蒼耳子
#발산풍열약|發散風熱藥|辛涼解表藥
박하/薄荷;우방자/牛蒡子;상엽/桑葉;국화/菊花;갈근/葛根;시호/柴胡;승마/升麻;만형자/蔓荊子;담두시/淡豆豉;선태/蟬蛻;부평/浮萍;목적/木賊
@청열약|淸熱藥

const $=(s,r=document)=>r.querySelector(s);

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

function lsSet(k,v){try{localStorage.setItem('bj_'+k,v);}catch(e){}}
function stable(o){if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return '['+o.map(stable).join(',')+']';return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';}

/* ===== 한글/한자 ===== */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const isHangul=c=>{const n=c.charCodeAt(0);return n>=0xAC00&&n<=0xD7A3;};
const isHanja=c=>{const n=c.charCodeAt(0);return (n>=0x4E00&&n<=0x9FFF)||(n>=0x3400&&n<=0x4DBF)||(n>=0xF900&&n<=0xFAFF);};
function chosung(s){let r='';for(const ch of s){if(isHangul(ch))r+=CHO[Math.floor((ch.charCodeAt(0)-0xAC00)/588)];else r+=ch;}return r;}
const GK={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
const GORDER='ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ#';
function groupKey(s){const c=(s||'').charAt(0);if(c&&isHangul(c)){const k=CHO[Math.floor((c.charCodeAt(0)-0xAC00)/588)];return GK[k]||k;}return '#';}
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
let CHARMAP={};
function buildCharMap(list){
  const cnt={};
  list.forEach(h=>{
    const pairs=[[h.name,h.hanja]].concat((h.aliasList||[]).map(a=>[a.n,a.h]));
    pairs.forEach(([n,hz])=>{
      const hs=Array.from(hz||'').filter(isHanja),ks=Array.from(n||'').filter(isHangul);
      if(hs.length&&hs.length===ks.length&&Array.from(n).length===ks.length){hs.forEach((c,i)=>{const m=cnt[c]||(cnt[c]={});m[ks[i]]=(m[ks[i]]||0)+1;});}
    });
  });
  Object.keys(cnt).forEach(c=>{let best=null,bn=0;Object.keys(cnt[c]).forEach(k=>{if(cnt[c][k]>bn){bn=cnt[c][k];best=k;}});CHARMAP[c]=best;});
}
function toHangul(s){let r='';for(const ch of String(s||'')){r+=(isHanja(ch)&&CHARMAP[ch])?CHARMAP[ch]:ch;}return r;}

/* ===== 데이터 파싱 ===== */
function parseData(){
  const tree=[],herbs=[];let ch=null,sec=null,ci=0,hi=0;
  DATA.split('\n').forEach(line=>{
    line=line.trim();if(!line)return;
    if(line[0]==='@'){const p=line.slice(1).split('|');ci++;ch={id:'c'+ci,name:p[0],hanja:p[1]||'',note:p[2]||'',kids:[]};tree.push(ch);sec=null;}
    else if(line[0]==='#'){const p=line.slice(1).split('|');sec={id:ch.id+String.fromCharCode(96+ch.kids.length+1),name:p[0],hanja:p[1]||'',note:p[2]||'',kids:[]};ch.kids.push(sec);}
    else{
      const cat=sec||ch;
      line.split(';').forEach(tok=>{
        tok=tok.trim();if(!tok)return;
        const parts=tok.split('=');const nh=parts[0].split('/');
        hi++;
        herbs.push({id:'h'+String(hi).padStart(4,'0'),name:nh[0].trim(),hanja:(nh[1]||'').trim(),
          aliasList:parts[1]?parts[1].split(',').map(a=>{const x=a.split('/');return {n:x[0].trim(),h:(x[1]||'').trim()};}):[],
          catId:cat.id,order:hi});
      });
    }
  });
  return {tree,herbs};
}

const S={
  baseTree:null,tree:null,treeCustom:false,catMap:{},base:[],baseById:{},docs:{},sigs:{},herbs:[],byId:{},

function initData(){
  const P=parseData();
  S.baseTree=P.tree;S.base=P.herbs;S.baseById={};P.herbs.forEach(h=>S.baseById[h.id]=h);
  S.tree=clone(P.tree);buildCats();buildCharMap(P.herbs);
}
function buildCats(){
  S.catMap={};
  const walk=(nodes,parent,depth)=>nodes.forEach(n=>{S.catMap[n.id]={node:n,parent,depth};if(n.kids&&n.kids.length)walk(n.kids,n,depth+1);});
  walk(S.tree,null,0);
}
const catOf=id=>S.catMap[id]?id:'uncat';
function catPath(id){const c=S.catMap[id];if(!c)return '미분류';return c.parent?c.parent.name+' › '+c.node.name:c.node.name;}
function catShort(id){const c=S.catMap[id];return c?c.node.name:'미분류';}
function catSet(id){const set=new Set();const add=n=>{set.add(n.id);(n.kids||[]).forEach(add);};if(id==='uncat')set.add('uncat');else if(S.catMap[id])add(S.catMap[id].node);return set;}

function merge(b,d,id){
  d=d||{};
  const base=b||{id:id,name:'',hanja:'',aliasList:[],catId:'uncat',order:null};
  const alias=d.alias!=null?d.alias:(base.aliasList||[]).map(a=>a.h?(a.n+'('+a.h+')'):a.n).join(', ');
  return {id:base.id,base:!!b,name:d.name!=null?d.name:base.name,hanja:d.hanja!=null?d.hanja:base.hanja,alias:alias,
    catId:d.catId!=null?d.catId:base.catId,order:base.order!=null?base.order:(1e6+(d.createdAt||0)%1e9),
    info:(function(){const o={};['sci','family','nature','effect','indication'].forEach(k=>{if(d[k])o[k]=d[k];});return Object.assign(o,d.info||{});})(),
    fav:!!d.fav,tabs:Array.isArray(d.tabs)?d.tabs:null,deleted:!!d.deleted,updatedAt:d.updatedAt||0};
}
function buildHerbs(){
  const list=[],seen={};
  S.base.forEach(b=>{list.push(merge(b,S.docs[b.id],b.id));seen[b.id]=1;});
  Object.keys(S.docs).forEach(id=>{if(!seen[id]&&S.docs[id]&&S.docs[id].custom)list.push(merge(null,S.docs[id],id));});
  S.herbs=list;S.byId={};list.forEach(h=>S.byId[h.id]=h);
}
function refreshHerb(id){
  const nh=merge(S.baseById[id]||null,S.docs[id],id);
  const i=S.herbs.findIndex(x=>x.id===id);
  if(i>=0)S.herbs[i]=nh;else S.herbs.push(nh);
  S.byId[id]=nh;delete idxCache[id];
}
const fieldsOf=()=>Array.isArray(S.settings.fields)?S.settings.fields:DEFAULT_FIELDS;
const tplTabs=()=>(S.settings.tabs&&S.settings.tabs.length?S.settings.tabs:DEFAULT_TABS).map((t,i)=>({id:'tpl'+i,title:t,html:''}));
const getTabs=h=>(h.tabs&&h.tabs.length)?h.tabs:tplTabs();
function hasContent(h){
  if(h.info&&fieldsOf().some(f=>h.info[f.k]))return true;
  return !!(h.tabs&&h.tabs.some(t=>t.html&&t.html.length>0));
}

/* ================= 저장 ================= */
const timers={},writing={};let chain=Promise.resolve();
const isPending=id=>!!timers[id]||!!writing[id];
function setStatus(kind,msg){
  S.status={kind,msg};
  const t=kind==='saving'?'저장 중…':kind==='saved'?'저장됨':kind==='error'?('저장 실패'+(msg?': '+msg:'')):'';
  $$('#stat').forEach(el=>{el.textContent=t;el.style.color=kind==='error'?'var(--seal)':'';});
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')return '저장 공간 한도 초과';
  if(c==='invalid_argument')return '문서가 너무 크거나 쓰기 권한이 없습니다';
  if(c==='resource_exhausted')return '요청이 많습니다. 잠시 후 다시 시도하세요';
  if(c==='revoked')return '접근 권한이 해제되었습니다';
  return (e&&e.message)||'알 수 없는 오류';
}
function queueSave(id,delay){
  if(!S.db||!S.uid)return;
  setStatus('saving');
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>flush(id),delay==null?700:delay);
}
function flush(id){
  clearTimeout(timers[id]);delete timers[id];
  if(!S.db||!S.uid||writing[id]==='queued')return;
  writing[id]='queued';
  chain=chain.then(async()=>{
    writing[id]='inflight';
    try{
      const d=S.docs[id];
      if(!d){await S.db.doc('herbs/'+id).delete();}
      else{const data=clone(d);await S.db.doc('herbs/'+id).set(data);S.sigs[id]=stable(data);}
      S.lastWrite[id]=Date.now();
      if(!Object.keys(timers).length)setStatus('saved');
    }catch(e){setStatus('error',errMsg(e));toast('저장 실패: '+errMsg(e),4000);}
    finally{delete writing[id];}
  }).catch(()=>{});
}
function flushAll(){Object.keys(timers).forEach(flush);}
function patchDoc(id,patch){
  const d=S.docs[id]=Object.assign({},S.docs[id]||{},patch);
  d.updatedAt=Date.now();
  refreshHerb(id);queueSave(id);
  return d;
}
async function saveMeta(name,data){
  if(!S.db)return;
  try{setStatus('saving');await S.db.doc('meta/'+name).set(clone(data));setStatus('saved');}
  catch(e){setStatus('error',errMsg(e));toast('저장 실패: '+errMsg(e),4000);}
}

/* ================= 보안 정리 ================= */
function sanitize(html){
  const t=document.createElement('template');t.innerHTML=html||'';
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form,input,button,textarea,select,svg,math,video,audio').forEach(n=>n.remove());
  t.content.querySelectorAll('img').forEach(n=>{
    if(n.getAttribute('data-path')){n.removeAttribute('src');return;}
    const s=n.getAttribute('src')||'';if(/^\s*https?:/i.test(s)||!s)n.remove();
  });
  t.content.querySelectorAll('*').forEach(el=>{
    Array.from(el.attributes).forEach(a=>{
      const n=a.name.toLowerCase(),v=a.value;
      if(n.indexOf('on')===0)el.removeAttribute(a.name);
      else if((n==='href'||n==='src'||n==='xlink:href')&&/^\s*(javascript|vbscript|data:text)/i.test(v))el.removeAttribute(a.name);
      else if(n==='class'||n==='id'||n==='contenteditable')el.removeAttribute(a.name);
      else if(n==='style'&&/url\(|expression|position\s*:/i.test(v))el.removeAttribute(a.name);
    });
  });
  return t.innerHTML;
}
function stripHtml(html){const t=document.createElement('template');t.innerHTML=html||'';return (t.content.textContent||'').replace(/\s+/g,' ').trim();}
function isBlank(html){return !stripHtml(html)&&!/<(img|table|hr)/i.test(html);}

/* ================= 검색 ================= */
const idxCache={};
function getIdx(h){
  const key=h.updatedAt+'|'+h.name+'|'+h.hanja+'|'+h.alias;
  const c=idxCache[h.id];if(c&&c.key===key)return c;
  const name=norm(h.name),hanja=norm(h.hanja),alias=norm(h.alias);
  const raw=Object.keys(h.info||{}).map(k=>h.info[k]).filter(Boolean).concat((h.tabs||[]).map(t=>t.title+' '+stripHtml(t.html))).join(' ').trim();
  const text=norm(raw);
  const x={key,name,hanja,alias,cho:chosung(name),aliasCho:chosung(alias),aliasKo:toHangul(alias),text,textKo:text?toHangul(text):'',raw};
  idxCache[h.id]=x;return x;
}
function snippet(raw,q){
  const i=raw.toLowerCase().indexOf(q.trim().toLowerCase());if(i<0)return '';
  return '…'+raw.slice(Math.max(0,i-24),i+q.trim().length+44)+'…';
}
function matchHerb(h,q){
  const qn=norm(q);if(!qn)return {score:1};
  const x=getIdx(h);
  if(/^[ㄱ-ㅎ]+$/.test(qn)){
    if(x.cho.indexOf(qn)===0)return {score:90};
    if(x.cho.indexOf(qn)>=0)return {score:70};
    if(x.aliasCho.indexOf(qn)>=0)return {score:50};
    return {score:0};
  }
  if(x.name===qn||x.hanja===qn)return {score:100};
  if(x.name.indexOf(qn)===0)return {score:92};
  if(x.hanja&&x.hanja.indexOf(qn)===0)return {score:90};
  if(x.name.indexOf(qn)>=0)return {score:80};
  if(x.hanja&&x.hanja.indexOf(qn)>=0)return {score:78};
  if(x.alias.indexOf(qn)>=0||x.aliasKo.indexOf(qn)>=0)return {score:60};
  if(S.inContent&&x.text){
    if(x.text.indexOf(qn)>=0)return {score:30,content:true,snip:snippet(x.raw,q)};
    if(x.textKo.indexOf(qn)>=0)return {score:25,content:true,snip:''};
  }
  return {score:0};
}
const cmpKo=(a,b)=>KO.compare(a.name,b.name)||KO.compare(a.hanja,b.hanja);

/* ================= 목록 화면 ================= */
function hjClass(h){

}
function cardHtml(h,m){

function rowHtml(h,m){

function itemsHtml(arr,ms){
  const f=S.view==='grid'?cardHtml:rowHtml;
  const inner=arr.map(h=>f(h,ms?ms[h.id]:null)).join('');
  return S.view==='grid'?'<div class="grid">'+inner+'</div>':'<div class="rows">'+inner+'</div>';
}
function visibleHerbs(){
  let items=S.herbs.filter(h=>!h.deleted);
  if(S.fav)items=items.filter(h=>h.fav);
  if(S.catFilter){const set=catSet(S.catFilter);items=items.filter(h=>set.has(catOf(h.catId)));}
  return items;
}
function renderList(){
  const el=$('#list'),q=S.q.trim();
  const items=visibleHerbs();
  let html='',jump='',count=items.length;
  if(q){
    const ms={},res=[];
    items.forEach(h=>{const m=matchHerb(h,q);if(m.score>0){ms[h.id]=m;res.push(h);}});
    res.sort((a,b)=>(ms[b.id].score-ms[a.id].score)||cmpKo(a,b));
    count=res.length;
    html=res.length?itemsHtml(res,ms):'<div class="empty"><p>‘'+esc(q)+'’와 일치하는 본초가 없습니다.</p><button class="btn" data-act="add-q">이 이름으로 본초 추가</button></div>';
  }else if(!items.length){
    html='<div class="empty"><p>'+(S.fav?'즐겨찾기한 본초가 없습니다.':'표시할 본초가 없습니다.')+'</p></div>';
  }else if(S.sort==='ko'){
    const g={};items.slice().sort(cmpKo).forEach(h=>{(g[groupKey(h.name)]=g[groupKey(h.name)]||[]).push(h);});
    const keys=Object.keys(g).sort((a,b)=>GORDER.indexOf(a)-GORDER.indexOf(b));
    html=keys.map(k=>'<section class="grp" id="g-'+(k==='#'?'etc':k)+'"><h2 class="gh">'+k+'<small>'+g[k].length+'개</small></h2>'+itemsHtml(g[k])+'</section>').join('');
    jump=keys.map(k=>'<button type="button" data-jump="g-'+(k==='#'?'etc':k)+'">'+k+'</button>').join('');
  }else{
    const by={};items.forEach(h=>{const c=catOf(h.catId);(by[c]=by[c]||[]).push(h);});
    const ord=(a,b)=>(a.order-b.order)||cmpKo(a,b);
    const out=[],jl=[];
    const nodeCount=n=>{let c=(by[n.id]||[]).length;(n.kids||[]).forEach(k=>c+=nodeCount(k));return c;};
    S.tree.forEach(ch=>{
      const total=nodeCount(ch);if(!total)return;

async function tableOp(op){
  if(op==='ins'){
    const v=await ask('표 넣기',[{k:'r',label:'행 수',type:'number',value:'3'},{k:'c',label:'열 수',type:'number',value:'3'}],'넣기');
    if(!v)return;
    const r=Math.min(30,Math.max(1,+v.r||3)),c=Math.min(12,Math.max(1,+v.c||3));
    let html='<table><tbody>';
    for(let i=0;i<r;i++){html+='<tr>';for(let j=0;j<c;j++)html+=(i===0?'<th>':'<td>')+'<br>'+(i===0?'</th>':'</td>');html+='</tr>';}
    html+='</tbody></table><p><br></p>';

  }
  restoreSel();
  const cell=curCell();if(!cell){toast('표 안의 칸을 먼저 선택하세요');return;}
  const tr=cell.parentElement,table=cell.closest('table'),idx=cell.cellIndex;
  if(op==='addrow'){const n=tr.cloneNode(false);Array.from(tr.cells).forEach(()=>{const d=document.createElement('td');d.innerHTML='<br>';n.appendChild(d);});tr.after(n);}
  else if(op==='addcol'){Array.from(table.rows).forEach(r=>{const d=document.createElement(r.parentElement.tagName==='THEAD'||(r.cells[0]&&r.cells[0].tagName==='TH'&&r.rowIndex===0)?'th':'td');d.innerHTML='<br>';const ref=r.cells[idx];if(ref)ref.after(d);else r.appendChild(d);});}
  else if(op==='delrow'){tr.remove();if(!table.rows.length)table.remove();}
  else if(op==='delcol'){Array.from(table.rows).forEach(r=>{if(r.cells[idx])r.cells[idx].remove();if(!r.cells.length)r.remove();});if(!table.rows.length)table.remove();}
  else if(op==='deltbl'){table.remove();}
  onEdInput();
}

function dataUrlToBlob(u){
  const m=u.match(/^data:([^;,]+)(;base64)?,(.*)$/);if(!m)return null;
  const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]);const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:m[1]});
}

async function shrink(file){
  try{
    if(file.type==='image/gif')return file;
    const url=await readAsDataUrl(file);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=url;});
    const w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1600/Math.max(w,h));
    if(sc===1&&file.size<2.5e6)return file;
    const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
    return blob||file;
  }catch(e){return file;}
}
async function insertImages(files){

/* ---- 모달 ---- */
function closeModal(){const r=$('#modal-root');r.innerHTML='';}
function ask(title,fields,ok,opt){
  opt=opt||{};
  return new Promise(res=>{
    const root=$('#modal-root');
    const bg=document.createElement('div');bg.className='modal-bg';
    const fh=(fields||[]).map((f,i)=>{
      const id='mf'+i;
      if(f.type==='select')return '<label class="fld">'+esc(f.label)+'<select id="'+id+'">'+f.options.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===f.value?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>';
      if(f.type==='textarea')return '<label class="fld">'+esc(f.label)+'<textarea id="'+id+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(f.value||'')+'</textarea></label>';
      return '<label class="fld">'+esc(f.label)+'<input id="'+id+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.placeholder||'')+'"></label>';
    }).join('');
    bg.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3>'+esc(title)+'</h3>'+(opt.message?'<p>'+esc(opt.message)+'</p>':'')+fh
      +'<div class="mb"><button type="button" class="btn" data-m="cancel">취소</button><button type="button" class="btn '+(opt.danger?'danger':'primary')+'" data-m="ok">'+esc(ok||'확인')+'</button></div></div>';
    const done=v=>{bg.remove();document.removeEventListener('keydown',onKey,true);res(v);};
    const collect=()=>{const o={};(fields||[]).forEach((f,i)=>{o[f.k]=bg.querySelector('#mf'+i).value;});return o;};
    const onKey=e=>{
      if(e.key==='Escape'){e.stopPropagation();done(null);}
      else if(e.key==='Enter'&&!e.isComposing&&e.target.tagName!=='TEXTAREA'){e.preventDefault();done(collect());}
    };
    bg.addEventListener('click',e=>{
      if(e.target===bg)done(null);
      const m=e.target.closest('[data-m]');if(!m)return;
      done(m.dataset.m==='ok'?collect():null);
    });
    document.addEventListener('keydown',onKey,true);
    root.appendChild(bg);
    const first=bg.querySelector('input,select,textarea');if(first)first.focus();else{const b=bg.querySelector('[data-m=ok]');if(b)b.focus();}
  });
}
const confirmBox=(title,message,ok)=>ask(title,[],ok||'확인',{message,danger:true}).then(v=>!!v);

/* ---- 탭 조작 ---- */
function mutateTabs(fn){
  const h=curHerb();if(!h)return;
  commitEditor();
  const hh=curHerb();
  const tabs=getTabs(hh).map(t=>Object.assign({},t));
  fn(tabs);
  patchDoc(h.id,{tabs});
  renderDetail();
}
async function tabAction(act){
  const h=curHerb();if(!h)return;
  const tabs=getTabs(h),i=tabs.findIndex(t=>t.id===S.tabId),cur=tabs[i];
  if(act==='tab-add'){
    const v=await ask('탭 추가',[{k:'t',label:'탭 이름',placeholder:'예) 약리·성분'}],'추가');
    if(!v||!v.t.trim())return;
    const id='t'+rid();
    mutateTabs(ts=>ts.splice(i+1,0,{id,title:v.t.trim(),html:''}));S.tabId=id;renderDetail();
  }else if(act==='tab-rename'){
    const v=await ask('탭 이름 변경',[{k:'t',label:'탭 이름',value:cur.title}],'변경');
    if(!v||!v.t.trim())return;
    mutateTabs(ts=>{ts[i].title=v.t.trim();});
  }else if(act==='tab-left'&&i>0){mutateTabs(ts=>{const x=ts.splice(i,1)[0];ts.splice(i-1,0,x);});}
  else if(act==='tab-right'&&i<tabs.length-1){mutateTabs(ts=>{const x=ts.splice(i,1)[0];ts.splice(i+1,0,x);});}
  else if(act==='tab-del'){
    if(tabs.length<=1){toast('탭은 최소 1개가 필요합니다');return;}
    const has=cur.html&&!isBlank(cur.html);
    const ok=await confirmBox('탭 삭제','‘'+cur.title+'’ 탭'+(has?'과 그 안의 내용이 모두':'이')+' 삭제됩니다. 되돌릴 수 없습니다.','삭제');
    if(!ok)return;
    mutateTabs(ts=>ts.splice(i,1));S.tabId=null;renderDetail();
  }
}

async function addHerb(prefill){
  if(!S.canWrite||!S.loaded){toast('로그인 후에 추가할 수 있습니다');return;}
  const opts=[];
  const walk=(nodes,pre)=>nodes.forEach(n=>{const l=(pre?pre+' › ':'')+n.name;opts.push([n.id,l]);if(n.kids&&n.kids.length)walk(n.kids,l);});
  walk(S.tree,'');opts.push(['uncat','미분류']);
  const dflt=S.catFilter&&S.catMap[S.catFilter]?S.catFilter:(opts[0][0]);
  const v=await ask('본초 추가',[
    {k:'name',label:'한글명',value:prefill&&!/[\u4E00-\u9FFF]/.test(prefill)?prefill:''},
    {k:'hanja',label:'한자명 (선택)',value:prefill&&/[\u4E00-\u9FFF]/.test(prefill)?prefill:''},
    {k:'cat',label:'분류',type:'select',options:opts,value:dflt}],'추가');
  if(!v)return;
  if(!v.name.trim()&&!v.hanja.trim()){toast('이름을 입력하세요');return;}
  const id='u'+Date.now().toString(36)+rid();
  patchDoc(id,{custom:true,name:v.name.trim()||v.hanja.trim(),hanja:v.hanja.trim(),catId:v.cat,createdAt:Date.now()});
  S.q='';$('#q').value='';
  S.pendingEdit=true;nav('/h/'+id);
  toast('본초를 추가했습니다');
}
async function deleteHerb(){
  const h=curHerb();if(!h)return;
  const ok=await confirmBox('본초 삭제','‘'+h.name+(h.hanja?'('+h.hanja+')':'')+'’을(를) 목록에서 삭제합니다.\n설정 > 삭제한 본초에서 복원할 수 있습니다.','삭제');
  if(!ok)return;
  patchDoc(h.id,{deleted:true});
  nav('/');toast('삭제했습니다');
}

function openCatManager(){
  const root=$('#modal-root');
  const bg=document.createElement('div');bg.className='modal-bg';
  const counts=()=>{const c={};S.herbs.forEach(h=>{if(h.deleted)return;const k=catOf(h.catId);c[k]=(c[k]||0)+1;});return c;};
  const draw=()=>{
    const cn=counts();
    const rows=[];
    const walk=(nodes,depth)=>nodes.forEach((n,i)=>{
      rows.push('<div class="cm-row" style="padding-left:'+(depth*18)+'px"><span class="nm">'+esc(n.name)+' <small>'+esc(n.hanja||'')+' · '+(cn[n.id]||0)+'개</small></span>'
        +'<button class="btn sm" data-c="up" data-id="'+n.id+'" title="위로" type="button">↑</button><button class="btn sm" data-c="down" data-id="'+n.id+'" title="아래로" type="button">↓</button>'
        +'<button class="btn sm" data-c="edit" data-id="'+n.id+'" type="button">이름</button>'
        +'<button class="btn sm" data-c="add" data-id="'+n.id+'" type="button">＋하위</button>'
        +'<button class="btn sm danger" data-c="del" data-id="'+n.id+'" type="button">삭제</button></div>');
      if(n.kids&&n.kids.length)walk(n.kids,depth+1);
    });
    walk(S.tree,0);
    bg.innerHTML='<div class="modal wide" role="dialog" aria-modal="true" aria-label="분류 관리"><h3>분류 관리</h3><p>대분류와 소분류의 이름·순서를 바꾸고 추가하거나 삭제합니다. 분류를 삭제하면 그 안의 본초는 ‘미분류’로 옮겨집니다.</p>'+rows.join('')
      +'<div class="mb"><button class="btn" data-c="addtop" type="button">＋ 대분류 추가</button><button class="btn primary" data-c="close" type="button">닫기</button></div></div>';
  };
  const siblings=id=>{const c=S.catMap[id];return c.parent?c.parent.kids:S.tree;};
  const save=async()=>{S.treeCustom=true;buildCats();draw();renderList();await saveMeta('cats',{tree:S.tree});};
  bg.addEventListener('click',async e=>{
    if(e.target===bg){bg.remove();return;}
    const b=e.target.closest('[data-c]');if(!b)return;
    const a=b.dataset.c,id=b.dataset.id;
    if(a==='close'){bg.remove();return;}
    if(a==='addtop'){const v=await ask('대분류 추가',[{k:'n',label:'이름'},{k:'h',label:'한자 (선택)'}],'추가');if(v&&v.n.trim()){S.tree.push({id:'x'+Date.now().toString(36)+rid(),name:v.n.trim(),hanja:v.h.trim(),note:'',kids:[]});save();}return;}
    const c=S.catMap[id];if(!c)return;
    if(a==='up'||a==='down'){const arr=siblings(id),i=arr.indexOf(c.node),j=a==='up'?i-1:i+1;if(j<0||j>=arr.length)return;arr.splice(i,1);arr.splice(j,0,c.node);save();}
    else if(a==='edit'){const v=await ask('분류 이름 변경',[{k:'n',label:'이름',value:c.node.name},{k:'h',label:'한자 (선택)',value:c.node.hanja||''}],'변경');if(v&&v.n.trim()){c.node.name=v.n.trim();c.node.hanja=v.h.trim();save();}}
    else if(a==='add'){const v=await ask('하위 분류 추가',[{k:'n',label:'이름'},{k:'h',label:'한자 (선택)'}],'추가');if(v&&v.n.trim()){c.node.kids=c.node.kids||[];c.node.kids.push({id:'x'+Date.now().toString(36)+rid(),name:v.n.trim(),hanja:v.h.trim(),note:'',kids:[]});save();}}
    else if(a==='del'){
      const set=catSet(id);const moved=S.herbs.filter(h=>set.has(catOf(h.catId)));
      const ok=await confirmBox('분류 삭제','‘'+c.node.name+'’ 분류(하위 분류 포함)를 삭제합니다.'+(moved.length?'\n그 안의 본초 '+moved.length+'개는 ‘미분류’로 이동합니다.':''),'삭제');
      if(!ok)return;
      moved.forEach(h=>patchDoc(h.id,{catId:'uncat'}));
      const arr=siblings(id);arr.splice(arr.indexOf(c.node),1);
      if(S.catFilter&&set.has(S.catFilter))S.catFilter=null;
      save();
    }
  });
  draw();root.appendChild(bg);
}

  try{await S.dl.save({filename:'본초노트-백업-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json',data:JSON.stringify(data)});toast('백업 파일을 저장했습니다');}
  catch(e){if(!e||e.code!=='declined')toast('백업 실패: '+((e&&e.code)||'오류'));}

async function importBackup(file){
  let data;
  try{data=JSON.parse(await file.text());}catch(e){toast('백업 파일을 읽을 수 없습니다');return;}
  if(!data||data.app!=='boncho-note'||!data.docs){toast('본초 노트 백업 파일이 아닙니다');return;}
  const ids=Object.keys(data.docs);
  const ok=await confirmBox('백업 복원','백업의 본초 기록 '+ids.length+'개를 현재 기록 위에 덮어씁니다. 같은 본초는 백업 내용으로 바뀝니다.','복원');
  if(!ok)return;
  if(!S.canWrite){toast('로그인 후에 복원할 수 있습니다');return;}
  let n=0;
  for(const id of ids){
    try{S.docs[id]=data.docs[id];await S.db.doc('herbs/'+id).set(clone(data.docs[id]));S.sigs[id]=stable(clone(data.docs[id]));}
    catch(e){toast('복원 중단: '+errMsg(e),5000);break;}
    n++;if(n%10===0)toast('복원 중… '+n+'/'+ids.length,3000);
  }
  if(data.cats&&Array.isArray(data.cats)){S.tree=data.cats;S.treeCustom=true;buildCats();await saveMeta('cats',{tree:S.tree});}
  if(data.settings&&Array.isArray(data.settings.tabs)){S.settings=Object.assign(S.settings,data.settings);await saveMeta('settings',S.settings);}
  buildHerbs();rerender();toast('복원 완료: '+n+'개');
}

function onHerbs(snap){
  let changed=false;
  snap.docChanges().forEach(ch=>{
    const id=ch.doc.id;if(isPending(id)||(Date.now()-(S.lastWrite[id]||0)<6000))return;
    if(ch.type==='removed'){if(S.docs[id]){delete S.docs[id];delete S.sigs[id];changed=true;}return;}
    const data=ch.doc.data()||{};const sg=stable(data);
    if(S.sigs[id]!==sg){S.sigs[id]=sg;S.docs[id]=Object.assign({},data);changed=true;}
  });
  const first=!S.loaded;S.loaded=true;
  if(changed||first){buildHerbs();rerenderSoon();}
  if(first&&S.route.name==='detail'&&!S.edit)renderDetail();
}
function onMeta(snap){
  let changed=false;
  snap.docs.forEach(d=>{
    const data=d.data()||{};
    if(d.id==='cats'&&Array.isArray(data.tree)){S.tree=data.tree;S.treeCustom=true;buildCats();changed=true;}
    if(d.id==='settings'){
      if(Array.isArray(data.tabs)&&data.tabs.length)S.settings.tabs=data.tabs;
      if(Array.isArray(data.fields))S.settings.fields=data.fields;
      if(data.colors&&Array.isArray(data.colors.fore)&&Array.isArray(data.colors.back)&&data.colors.fore.length&&data.colors.back.length)S.settings.colors=data.colors;

  });

}

const BUCKET='herb-images';
let SB=null;
const wrapErr=e=>({code:(e&&e.code)||'unknown',message:(e&&e.message)||String(e)});
async function fetchAll(col){
  const key=col==='herbs'?'id':'name',out=[];
  for(let from=0;;from+=1000){
    let q=SB.from(col).select('*');if(S.uid)q=q.eq('user_id',S.uid);
    const r=await q.order(key).range(from,from+999);
    if(r.error)throw r.error;
    out.push(...r.data);if(r.data.length<1000)break;
  }
  return out;
}
function watch(col,next,errCb){
  const key=col==='herbs'?'id':'name',known=new Set();let stopped=false;
  const mk=(id,data)=>({id,exists:true,data:()=>data});
  async function pull(){
    try{
      const rows=await fetchAll(col),docs=[],changes=[],seen=new Set();
      rows.forEach(r=>{const d=mk(r[key],r.data);docs.push(d);seen.add(r[key]);changes.push({type:'added',doc:d});});
      known.forEach(id=>{if(!seen.has(id))changes.push({type:'removed',doc:mk(id,{})});});
      known.clear();seen.forEach(id=>known.add(id));
      if(!stopped)next({docs,size:docs.length,empty:!docs.length,docChanges:()=>changes});
    }catch(e){if(errCb)errCb(wrapErr(e));}
  }
  const pullSoon=debounce(pull,400);
  pull();
  const onVis=()=>{if(!document.hidden)pullSoon();};
  document.addEventListener('visibilitychange',onVis);window.addEventListener('online',pullSoon);
  let ch=null;
  try{
    const opt={event:'*',schema:'public',table:col};if(S.uid)opt.filter='user_id=eq.'+S.uid;
    ch=SB.channel('rt-'+col).on('postgres_changes',opt,pullSoon).subscribe();
  }catch(e){}
  return()=>{stopped=true;document.removeEventListener('visibilitychange',onVis);try{if(ch)SB.removeChannel(ch);}catch(e){}};
}
function makeDb(){
  return {
    doc:path=>{
      const p=path.split('/'),col=p[0],id=p[1],key=col==='herbs'?'id':'name';
      return {
        set:async data=>{const r=await SB.from(col).upsert({user_id:S.uid,[key]:id,data:data,updated_at:new Date().toISOString()});if(r.error)throw wrapErr(r.error);},
        delete:async()=>{const r=await SB.from(col).delete().eq('user_id',S.uid).eq(key,id);if(r.error)throw wrapErr(r.error);}
      };
    },
    collection:col=>({onSnapshot:(next,errCb)=>watch(col,next,errCb)})
  };
}
const urlCache={};
async function signMany(paths){
  const need=paths.filter(p=>!urlCache[p]||urlCache[p].exp<Date.now()+60000);
  if(!need.length||!SB)return;
  const r=await SB.storage.from(BUCKET).createSignedUrls(need,21600);
  if(r.error||!r.data)return;
  r.data.forEach(d=>{if(d.signedUrl&&d.path)urlCache[d.path]={url:d.signedUrl,exp:Date.now()+21600e3};});
}
async function hydrateImages(root){
  if(!root)return;
  const imgs=$$('img[data-path]',root);if(!imgs.length)return;
  try{
    await signMany(Array.from(new Set(imgs.map(i=>i.getAttribute('data-path')))));
    imgs.forEach(i=>{const c=urlCache[i.getAttribute('data-path')];if(c&&root.contains(i))i.src=c.url;});
  }catch(e){}
}
function makeAssets(){
  return {upload:async blob=>{
    const ext={'image/png':'png','image/gif':'gif','image/webp':'webp'}[blob.type]||'jpg';
    const path=S.uid+'/'+Date.now().toString(36)+rid()+'.'+ext;
    const r=await SB.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:false});
    if(r.error)throw wrapErr(r.error);
    await signMany([path]);
    return {id:path,url:urlCache[path]?urlCache[path].url:''};
  }};
}
function makeDl(){
  return {save:async o=>{
    const blob=new Blob([o.data],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    return {status:'saved'};
  }};
}
function watchAll(){
  S.db.collection('meta').onSnapshot(onMeta,e=>console.error('meta',e));
  S.db.collection('herbs').onSnapshot(onHerbs,e=>{S.loaded=true;banner('기록을 불러오지 못했습니다: '+errMsg(e));rerender();});
}
function startSession(session){
  if(S.db||!session)return;

function startReadOnly(){

async function connect(){
  S.dl=makeDl();
  const cfg=window.BONCHO_CONFIG||{};
  if(!cfg.url||!cfg.anonKey||/YOUR|여기에/.test(cfg.url+cfg.anonKey)){
    S.dbState='none';S.loaded=true;rerender();
    banner('config.js에 Supabase 주소와 키를 입력해야 기록을 저장할 수 있습니다. (설정 안내서 참고)');return;
  }
  if(!window.supabase||!window.supabase.createClient){
    S.dbState='none';S.loaded=true;rerender();
    banner('저장소 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.');return;
  }
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  SB.auth.onAuthStateChange(ev=>{
    if(ev==='SIGNED_OUT'&&S.uid){try{location.reload();}catch(e){}}
  });
  let session=null;
  try{const r=await SB.auth.getSession();session=r.data&&r.data.session;}catch(e){}
  if(session)startSession(session);
  else startReadOnly();
}
function authMsgKo(m){
  m=m||'';
  if(/Invalid login/i.test(m))return '이메일 또는 비밀번호가 맞지 않습니다.';
  if(/already registered/i.test(m))return '이미 가입된 이메일입니다. 로그인해 보세요.';
  if(/Password should be/i.test(m))return '비밀번호는 6자 이상이어야 합니다.';
  if(/signups? (are )?(not allowed|disabled)/i.test(m))return '새 계정 만들기가 꺼져 있습니다. (이미 계정이 있다면 로그인하세요)';
  if(/rate limit/i.test(m))return '잠시 후 다시 시도하세요.';
  if(/Email not confirmed/i.test(m))return '이메일 확인이 필요합니다. 받은 메일의 링크를 눌러주세요.';
  return m||'오류가 발생했습니다.';
}
function openAuth(){
  if(!SB||$('#authBg'))return;
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='authBg';
  bg.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="로그인"><h3>로그인</h3>'
   +'<p>기록을 편집하려면 로그인하세요. (열람은 로그인 없이 가능합니다)</p>'
   +'<label class="fld">이메일<input id="auEmail" type="email" autocomplete="email" inputmode="email"></label>'
   +'<label class="fld">비밀번호<input id="auPw" type="password" autocomplete="current-password"></label>'
   +'<p id="auMsg" style="color:var(--seal);min-height:1.4em"></p>'
   +'<div class="mb"><button class="btn" data-a="close" type="button">나중에</button><button class="btn" data-a="signup" type="button">계정 만들기</button><button class="btn primary" data-a="login" type="button">로그인</button></div></div>';
  const msg=t=>{bg.querySelector('#auMsg').textContent=t;};
  const vals=()=>({email:bg.querySelector('#auEmail').value.trim(),password:bg.querySelector('#auPw').value});
  const finish=async()=>{
    const r=await SB.auth.getSession();
    if(r.data&&r.data.session){bg.remove();try{location.reload();}catch(e){}}
  };
  const login=async()=>{

    msg('로그인 중…');

  };

    msg('계정 만드는 중…');

    if(e.target===bg){bg.remove();return;}
    const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='close')bg.remove();

  });
  bg.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();login();}});
  $('#modal-root').appendChild(bg);

    const cmd=e.target.closest('[data-cmd]');
    if(cmd){
      const c=cmd.dataset.cmd;
      if(CMDS[c])run(CMDS[c],null,false);
      else if(c==='hl-off')run('hiliteColor','transparent',true);
      else if(c==='palette')openPaletteManager();
      else if(c==='sizeapply')applyNum();
      else if(c==='link')addLink();
      else if(c==='image'){if(S.assets){restoreSel();$('#imgFile').click();}}
      return;
    }
    const act=e.target.closest('[data-act]');if(!act)return;
    const a=act.dataset.act,h=curHerb();
    if(a==='back')nav('/');
    else if(a==='fav'&&h){if(!S.canWrite||!S.loaded){toast('저장소에 연결된 뒤에 사용할 수 있습니다');return;}patchDoc(h.id,{fav:!h.fav});renderDetail();}
    else if(a==='print'){try{window.print();}catch(err){toast('이 환경에서는 인쇄를 열 수 없습니다');}}
    else if(a==='login')openAuth();
    else if(a==='edit'){commitEditor();flushAll();S.edit=!S.edit;renderDetail();}
    else if(a==='del-herb')deleteHerb();
    else if(a.indexOf('tab-')===0)tabAction(a);
  });
  box.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='ed'){onEdInput();return;}
    if(t.dataset&&t.dataset.info){autoGrow(t);const h=curHerb();if(h)patchDoc(h.id,{info:Object.assign({},h.info,{[t.dataset.info]:t.value})});return;}
    if(t.dataset&&t.dataset.f&&t.tagName==='INPUT'){const h=curHerb();if(!h)return;const k=t.dataset.f;patchDoc(h.id,{[k]:t.value});updateHead(S.byId[h.id]);}
  });
  box.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset&&t.dataset.f==='catId'){const h=curHerb();if(h){patchDoc(h.id,{catId:t.value});updateHead(S.byId[h.id]);}return;}
    if(t.dataset&&t.dataset.sel){
      const v=t.value,k=t.dataset.sel;t.value='';
      if(!v)return;
      if(k==='font')run('fontName',v,true);
      else if(k==='size')applySize(+v);
      else if(k==='block'){run('formatBlock','<'+v+'>',false);}
      else if(k==='imgsize'){const im=S.selImg||$('#ed img.sel');if(!im||!$('#ed').contains(im)){toast('크기를 바꿀 사진을 먼저 눌러 선택하세요');return;}im.style.width=v==='auto'?'':v;im.style.height='auto';onEdInput();}
      else if(k==='table')tableOp(v);
      return;
    }
    if(t.id==='imgFile'){insertImages(Array.from(t.files||[]));t.value='';}
  });
  box.addEventListener('keydown',e=>{if(e.target.id==='szNum'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();applyNum();}});
  box.addEventListener('focusout',e=>{if(e.target.id==='ed'){commitEditor();flushAll();}});
  box.addEventListener('paste',e=>{
    if(e.target.id!=='ed')return;
    const files=Array.from((e.clipboardData&&e.clipboardData.files)||[]).filter(f=>/^image\//.test(f.type));
    if(files.length){e.preventDefault();insertImages(files);}
  });
  box.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#ed')&&S.edit)e.preventDefault();});
  box.addEventListener('drop',e=>{
    if(!(e.target.closest&&e.target.closest('#ed'))||!S.edit)return;
    const files=Array.from((e.dataTransfer&&e.dataTransfer.files)||[]).filter(f=>/^image\//.test(f.type));
    if(!files.length)return;
    e.preventDefault();
    try{let r=null;if(document.caretRangeFromPoint)r=document.caretRangeFromPoint(e.clientX,e.clientY);if(r){S.range=r;}}catch(err){}
    insertImages(files);
  });
}

/* ================= 시작 ================= */
function start(){
  initData();applyTheme();buildHerbs();bindGlobal();
  route(location.hash.replace(/^#/,''));
  syncStick();
  connect();
}
start();
</script>
